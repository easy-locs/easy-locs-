    <script>
      // Prevent flash of wrong theme
      (function(){try{var t=localStorage.getItem('easylocs-theme');if(t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme:dark)').matches)||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}}catch(e){}})();
    </script>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[99999] focus:px-4 focus:py-2 focus:bg-primary focus:text-primary-foreground focus:rounded-lg focus:text-sm focus:font-semibold">Skip to main content</a>
    <div id="root">
      <!-- Inline fallback shown while JS loads — prevents blank page -->
      <div id="app-loading" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;" class="bg-background text-muted-foreground">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid hsl(var(--accent, 43 74% 58%));border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
          <p style="font-size:14px;margin:0;">Loading Easy-Locs…</p>
        </div>
        <style>@keyframes spin{to{transform:rotate(360deg)}}:root{--accent:43 74% 58%}.dark #app-loading{background:#0F1117;color:#94a3b8}#app-loading{background:#fafafa;color:#64748b}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Crash recovery: if React hasn't rendered after 20s, show error + reload button.
      // Mark boot success so timeout becomes a no-op once React mounts.
      window.__EASYLOCS_BOOTED__=false;
      setTimeout(function(){
        if(window.__EASYLOCS_BOOTED__)return;
        var root=document.getElementById('root');
        var el=root&&root.querySelector('#app-loading');
        if(!el&&root&&root.children.length>0)return; // React rendered something
        var target=el||root;
        if(target){
          target.innerHTML='<div style="text-align:center;max-width:400px;padding:20px;"><p style="font-size:18px;color:#f8fafc;margin:0 0 8px;">Unable to load Easy-Locs</p><p style="font-size:13px;color:#94a3b8;margin:0 0 16px;">A network or cache error prevented the app from starting.</p><button onclick="try{caches.keys().then(function(n){n.forEach(function(k){caches.delete(k)})}).then(function(){location.reload()})}catch(e){location.reload()}" style="background:#D4A853;color:#0F1117;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Reload</button></div>';
        }
      },20000);
    </script>
