name: "Massive Deploy Gate 2026 — Atomic Verification"

# ════════════════════════════════════════════════════════════════════════════
# MASSIVE DEPLOY + ATOMIC VERIFICATION + REPAIR-ORIENTED SYSTEM
# ════════════════════════════════════════════════════════════════════════════
# Non-negotiable: NO MERGE, NO DEPLOY PROMOTION, NO SAFE_TO_MERGE verdict
# until every atomic gate passes.
#
# Big Tech 2026+ strictness.
# ════════════════════════════════════════════════════════════════════════════

on:
  push:
  pull_request:

# Cancel stale pipeline runs instantly when a new commit arrives.
# Ultra-reactive: no queuing stale runs.
concurrency:
  group: "massive-gate-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  WORKING_DIR: easy-locs-ea1eb0ed

# ════════════════════════════════════════════════════════════════════════════
# GATE 1 — TypeScript Strict (zero type errors)
# ════════════════════════════════════════════════════════════════════════════
jobs:
  typecheck:
    name: "🔷 TypeScript strict"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "TypeScript — noEmit strict check"
        run: npm run check:strict-core

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 2 — ESLint (zero warnings/errors)
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 ESLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 3 — Unit + LC governance (LC1..LC9, vitest)
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "🧪 Unit + LC governance"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Vitest full suite"
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 4 — Contract tests (edge-function contract matrix)
  # ══════════════════════════════════════════════════════════════════════════
  contracts:
    name: "📋 Contract tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Contract tests (vitest)"
        run: npm run test:contracts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 5 — Architecture checks (routes, imports, orphans, pillar ownership)
  # ══════════════════════════════════════════════════════════════════════════
  architecture:
    name: "🏗️ Architecture checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "No NEW duplicate routes"
        run: npm run check:route-uniqueness
      - name: "Pillar route ownership"
        run: npm run check:pillar-routes
      - name: "No NEW broken @/ imports"
        run: npm run check:import-aliases
      - name: "No NEW orphan pages"
        run: npm run check:page-orphans
      - name: "Generate route inventory (553+ routes)"
        run: node scripts/generate-route-inventory.cjs

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 6 — Edge function contract matrix
  # ══════════════════════════════════════════════════════════════════════════
  edge-fn-contracts:
    name: "🌐 Edge function contracts"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Contract matrix CI gate"
        run: npm run contracts:matrix:ci

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 7 — Security audit (npm + edge-fn inventory)
  # ══════════════════════════════════════════════════════════════════════════
  security-audit:
    name: "🔐 Security audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "npm audit (prod deps, high+)"
        run: npm audit --omit=dev --audit-level=high
      - name: "Edge functions auth inventory"
        run: npx --yes tsx scripts/security-inventory-edge-functions.ts
      - name: "Check inventory drift"
        run: |
          if ! git diff --exit-code -- docs/security/edge-functions-auth-inventory.md docs/security/unclassified-baseline.json; then
            echo "::error::Inventory is out of date — run 'npx tsx scripts/security-inventory-edge-functions.ts' and commit."
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 8 — Secret scan (all commits)
  # ══════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "🔑 Secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Scan for leaked secrets"
        run: bash scripts/secret-scan.sh

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 9 — SAST (Semgrep OWASP + JS/TS/React)
  # ══════════════════════════════════════════════════════════════════════════
  sast:
    name: "🛡️ SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: "Semgrep OWASP + JS/TS/React"
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react
        env:
          SEMGREP_SEND_METRICS: "off"

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 10 — Cloudflare strict config check
  # Verifies _worker.js SPA fallback, _headers CSP, wrangler.toml, build:cf
  # ══════════════════════════════════════════════════════════════════════════
  cloudflare-strict:
    name: "☁️ Cloudflare strict config"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - name: "Cloudflare strict config check"
        run: node scripts/check-cloudflare-strict.cjs

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 11 — Supabase lazy access guard
  # Ensures no module eagerly touches Supabase sub-clients at module init
  # ══════════════════════════════════════════════════════════════════════════
  supabase-lazy:
    name: "🗄️ Supabase lazy access"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - name: "Supabase lazy access guard"
        run: node scripts/check-supabase-lazy-access.cjs

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 12 — E2EE crypto tests
  # ══════════════════════════════════════════════════════════════════════════
  e2ee-tests:
    name: "🔒 E2EE crypto tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "Orbit E2EE double-ratchet tests"
        run: npx vitest run src/lib/__tests__/orbit-double-ratchet.test.ts

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 13 — Bundle size gate (≤+10% vs origin/main)
  # ══════════════════════════════════════════════════════════════════════════
  bundle-size:
    name: "📦 Bundle size gate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch main for baseline"
        run: git fetch origin main:refs/remotes/origin/main --depth=1 || true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Build (standard)"
        run: npm run build
        env:
          BUDGET_ENFORCE: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: "Verify dist/assets produced"
        run: |
          if [ ! -d dist/assets ] || [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::Build did not produce dist/assets"
            exit 1
          fi
          echo "dist/assets: $(ls dist/assets | wc -l) files"
      - name: "Bundle size gate (≤+10% vs origin/main)"
        run: npm run bundle:gate
        env:
          BUNDLE_SIZE_THRESHOLD: "0.10"
          BUNDLE_SIZE_BASELINE_REF: "origin/main"

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 14 — Cloudflare build:cf + dist asset verification
  # Verifies build:cf succeeds and dist/ is correct
  # ══════════════════════════════════════════════════════════════════════════
  cf-build-and-verify:
    name: "🚀 Cloudflare build:cf + dist verify"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    env:
      NODE_OPTIONS: "--max-old-space-size=1536"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Cloudflare build:cf"
        run: npm run build:cf
        env:
          SKIP_HEAVY_SEO: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: "Verify dist assets (index.html, chunks, no .map/.br/.gz)"
        run: node scripts/check-dist-assets.cjs
      - name: "Upload dist asset report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-asset-report-${{ github.sha }}
          path: easy-locs-ea1eb0ed/docs/runtime/DIST_ASSET_REPORT.md
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 15 — Playwright route matrix smoke (@smoke)
  # Visits public routes, verifies no black screen / crash / CF 404
  # Protected routes: verifies redirect to /login (no crash)
  # ══════════════════════════════════════════════════════════════════════════
  playwright-smoke:
    name: "🎭 Playwright route matrix smoke"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Install Playwright (chromium)"
        run: npx playwright install --with-deps chromium
      - name: "Build for preview"
        run: npm run build:cf
        env:
          SKIP_HEAVY_SEO: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: "Start preview server"
        run: npx vite preview --port 5173 &
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: "Wait for preview server"
        run: npx wait-on http://localhost:5173 --timeout 30000
      - name: "Route matrix smoke tests (@smoke)"
        run: npx playwright test --project=chromium-desktop --grep "@smoke" e2e/route-matrix.spec.ts
        env:
          BASE_URL: "http://localhost:5173"
      - name: "Playwright route matrix report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-route-matrix-${{ github.sha }}
          path: easy-locs-ea1eb0ed/test-results/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # GATE 16 — Hosted preview verification (BASE_URL required)
  # Only runs when BASE_URL secret is set.
  # Without BASE_URL, skips — final verdict becomes
  # KEEP_OPEN_RUNTIME_VERIFICATION_REQUIRED (non-main) or blocks (main).
  # ══════════════════════════════════════════════════════════════════════════
  hosted-verification:
    name: "🌍 Hosted preview verification"
    runs-on: ubuntu-latest
    # Skip if no hosted URL is configured
    if: ${{ secrets.BASE_URL != '' }}
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Install Playwright (chromium)"
        run: npx playwright install --with-deps chromium
      - name: "Route matrix smoke against hosted URL"
        run: npx playwright test --project=chromium-desktop --grep "@smoke" e2e/route-matrix.spec.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
      - name: "Flow coverage against hosted URL"
        run: npx playwright test --project=chromium-desktop --grep "@flow" e2e/flows/public-flow.spec.ts
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
      - name: "Upload hosted verification results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-verification-${{ github.sha }}
          path: easy-locs-ea1eb0ed/test-results/
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  # FINAL VERDICT — ALL GATES PASSED
  # This is THE ONLY status check to register in branch protection.
  # Fails unless every parallel gate above passes.
  # Generates FINAL_DEPLOY_VERDICT.md with one of:
  #   SAFE_TO_MERGE
  #   KEEP_OPEN_RUNTIME_VERIFICATION_REQUIRED
  #   DO_NOT_MERGE_BLOCKERS_FOUND
  # ══════════════════════════════════════════════════════════════════════════
  all-gates-passed:
    name: "✅ ALL GATES PASSED — SAFE_TO_MERGE"
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - unit-tests
      - contracts
      - architecture
      - edge-fn-contracts
      - security-audit
      - secret-scan
      - sast
      - cloudflare-strict
      - supabase-lazy
      - e2ee-tests
      - bundle-size
      - cf-build-and-verify
      - playwright-smoke
    if: always()
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - name: "Evaluate all gate results + generate final verdict"
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          EDGE_FN_CONTRACTS: ${{ needs.edge-fn-contracts.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          SAST: ${{ needs.sast.result }}
          CLOUDFLARE_STRICT: ${{ needs.cloudflare-strict.result }}
          SUPABASE_LAZY: ${{ needs.supabase-lazy.result }}
          E2EE_TESTS: ${{ needs.e2ee-tests.result }}
          BUNDLE_SIZE: ${{ needs.bundle-size.result }}
          CF_BUILD_VERIFY: ${{ needs.cf-build-and-verify.result }}
          PLAYWRIGHT_SMOKE: ${{ needs.playwright-smoke.result }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          echo "═══════════════════════════════════════════════════════"
          echo "  MASSIVE DEPLOY GATE 2026 — ATOMIC VERDICT"
          echo "═══════════════════════════════════════════════════════"
          FAILED=0
          check() {
            local name="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "  ✅  $name"
            elif [ "$result" = "skipped" ]; then
              echo "  ⏭️  $name (skipped)"
            else
              echo "  ❌  $name → $result"
              FAILED=1
            fi
          }
          check "TypeScript strict"           "$TYPECHECK"
          check "ESLint"                      "$LINT"
          check "Unit + LC governance"        "$UNIT_TESTS"
          check "Contract tests"              "$CONTRACTS"
          check "Architecture checks"         "$ARCHITECTURE"
          check "Edge function contracts"     "$EDGE_FN_CONTRACTS"
          check "Security audit"              "$SECURITY_AUDIT"
          check "Secret scan"                 "$SECRET_SCAN"
          check "SAST (Semgrep)"              "$SAST"
          check "Cloudflare strict config"    "$CLOUDFLARE_STRICT"
          check "Supabase lazy access"        "$SUPABASE_LAZY"
          check "E2EE crypto tests"           "$E2EE_TESTS"
          check "Bundle size gate"            "$BUNDLE_SIZE"
          check "CF build:cf + dist verify"   "$CF_BUILD_VERIFY"
          check "Playwright route matrix"     "$PLAYWRIGHT_SMOKE"
          echo "═══════════════════════════════════════════════════════"
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "  ❌  VERDICT: DO_NOT_MERGE_BLOCKERS_FOUND"
            echo ""
            echo "  One or more atomic gates failed."
            echo "  See repair report: docs/runtime/FINAL_DEPLOY_VERDICT.md"
            echo "  Non-negotiable: NO MERGE until ALL gates are green."
            exit 1
          fi
          if [ -z "$BASE_URL" ]; then
            echo ""
            echo "  ⚠️   VERDICT: KEEP_OPEN_RUNTIME_VERIFICATION_REQUIRED"
            echo ""
            echo "  All local + CI gates passed."
            echo "  BASE_URL not set → hosted Cloudflare verification pending."
            echo "  Set BASE_URL secret and re-run to get SAFE_TO_MERGE."
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "  🚨  This is the main branch — hosted verification is MANDATORY."
              exit 1
            fi
            exit 0
          fi
          echo ""
          echo "  ✅  VERDICT: SAFE_TO_MERGE"
          echo ""
          echo "  All ${FAILED} blocker gates green."
          echo "  Hosted verification complete."
          echo "  Ready for merge and Cloudflare Pages deploy."
      - name: "Upload route inventory"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-inventory-${{ github.sha }}
          path: |
            easy-locs-ea1eb0ed/docs/runtime/ROUTE_INVENTORY.md
            easy-locs-ea1eb0ed/docs/runtime/ROUTE_INVENTORY.json
            easy-locs-ea1eb0ed/docs/runtime/CLOUDFLARE_STRICT_REPORT.md
            easy-locs-ea1eb0ed/docs/runtime/SUPABASE_RUNTIME_GUARD.md
            easy-locs-ea1eb0ed/docs/runtime/FINAL_DEPLOY_VERDICT.md
          retention-days: 30
