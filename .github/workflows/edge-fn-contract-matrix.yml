name: Edge Function Contract Matrix

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gate runs FIRST against the checked-out (committed) state so the
      # built-in stale-artifact check in `contracts:matrix:ci` still has
      # teeth — comparing freshly-computed output against the committed
      # docs files. We use continue-on-error so the comment-posting steps
      # below still execute on failure; the final step propagates the
      # exit status to keep the job red.
      - name: Run contract matrix CI gate
        id: gate
        run: npm run contracts:matrix:ci
        continue-on-error: true

      # Regenerate the docs after the gate so the comment body reflects
      # the current state on this branch (including the very mismatches
      # the gate is failing on). Safe because we're not committing the
      # regenerated files — they're only used as input to the comment
      # builder and the failure-only artifact upload.
      - name: Regenerate contract matrix for comment + artifact
        if: always()
        run: npm run contracts:matrix

      - name: Build PR comment body
        if: always()
        run: npx tsx scripts/edge-function-contract-matrix-comment.ts ${{ github.workspace }}/edge-fn-contract-comment.md

      - name: Ensure comment body exists
        if: always()
        run: |
          if [ ! -s "${{ github.workspace }}/edge-fn-contract-comment.md" ]; then
            cat > "${{ github.workspace }}/edge-fn-contract-comment.md" <<EOF
          ## Edge Function Contract Matrix

          The contract matrix workflow did not produce a report for this commit.
          See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
          EOF
          fi

      - name: Post sticky PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: edge-fn-contract-matrix
          path: ${{ github.workspace }}/edge-fn-contract-comment.md

      - name: Upload regenerated matrix
        if: steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: edge-fn-contract-matrix
          path: |
            easy-locs-ea1eb0ed/docs/edge-functions-contract-matrix.md
            easy-locs-ea1eb0ed/docs/edge-functions-contract-matrix.json

      - name: Propagate gate result
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Edge Function contract matrix gate failed — see the sticky PR comment for the blocking mismatches."
          exit 1
