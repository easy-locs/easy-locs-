name: Edge Function Contract Matrix

# Runs the frontend ↔ Edge Function contract matrix on every pull request.
# The `--ci` flag (npm run contracts:matrix:ci) fails the step on any of:
#   - orphaned frontend call (target function does not exist on disk)
#   - method mismatch
#   - missing required body field
#   - missing body when handler requires JSON
#   - missing Authorization header on a fetch() to a JWT-required function
#   - stale committed matrix artifact (docs/edge-functions-contract-matrix.{md,json})
#
# This gates merges on contract drift instead of waiting for someone to
# remember to re-run the script locally.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-matrix:
    name: Edge function contract matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run contract matrix (CI mode — fails on mismatches or stale artifact)
        run: npm run contracts:matrix:ci

      - name: Regenerate matrix artifact for inspection on failure
        if: failure()
        run: npm run contracts:matrix

      - name: Upload regenerated matrix on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edge-functions-contract-matrix-${{ github.sha }}
          path: |
            easy-locs-ea1eb0ed/docs/edge-functions-contract-matrix.md
            easy-locs-ea1eb0ed/docs/edge-functions-contract-matrix.json
          retention-days: 14
