name: Simple Agent Runner

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install || echo "skip"

      - name: Test
        run: echo "Agent runner working"

      - name: Done
        run: echo "OK"
