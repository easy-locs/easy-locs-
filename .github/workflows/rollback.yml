name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROLLBACK to confirm reverting the last production deployment'
        required: true
        type: string
      reason:
        description: 'Reason for rollback'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rollback:
    name: Revert Last Production Deploy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'ROLLBACK'
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve last deployed SHA from tag
        id: resolve
        run: |
          git fetch --tags --force
          if ! git rev-parse "deploy/production-latest" >/dev/null 2>&1; then
            echo "::error::No deploy/production-latest tag found. Cannot determine last production deployment."
            echo "::error::Ensure the Vercel Production Deployment workflow has run at least once."
            exit 1
          fi

          DEPLOYED_SHA=$(git rev-parse "deploy/production-latest")
          echo "deployed-sha=${DEPLOYED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Last deployed production SHA: ${DEPLOYED_SHA}"

          if ! git merge-base --is-ancestor "${DEPLOYED_SHA}" origin/main 2>/dev/null; then
            echo "::error::Deployed SHA ${DEPLOYED_SHA} is not on main branch. Aborting."
            exit 1
          fi

          echo "Rollback target identified: reverting ${DEPLOYED_SHA}"

      - name: Create revert branch
        id: revert-branch
        run: |
          BRANCH="hotfix/rollback-$(date +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}" origin/main

          DEPLOYED_SHA="${{ steps.resolve.outputs.deployed-sha }}"

          if git cat-file -t "${DEPLOYED_SHA}" >/dev/null 2>&1; then
            git revert --no-edit "${DEPLOYED_SHA}" || {
              echo "::error::git revert failed for ${DEPLOYED_SHA}. It may be a merge commit."
              echo "Attempting revert with --mainline 1..."
              git revert --mainline 1 --no-edit "${DEPLOYED_SHA}"
            }
          else
            echo "::error::Cannot resolve commit ${DEPLOYED_SHA}. Aborting."
            exit 1
          fi

          git push origin "${BRANCH}"

      - name: Create rollback PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[ROLLBACK] Revert production deploy - ${new Date().toISOString().slice(0, 10)}`,
              head: '${{ steps.revert-branch.outputs.branch }}',
              base: 'main',
              body: [
                `## Production Rollback`,
                ``,
                `**This is an automated rollback PR. Merge promptly to revert production.**`,
                ``,
                `- **Deployed commit (reverted):** \`${{ steps.resolve.outputs.deployed-sha }}\``,
                `- **Deploy tag:** \`deploy/production-latest\``,
                `- **Triggered by:** @${context.actor}`,
                `- **Reason:** ${{ github.event.inputs.reason }}`,
                ``,
                `## How this works`,
                `1. The last production-deployed SHA was resolved from the \`deploy/production-latest\` git tag`,
                `2. That exact commit was reverted on a \`hotfix/rollback-*\` branch`,
                `3. CI will run on this PR to validate the revert`,
                `4. Merging this PR triggers a new production deployment with the reverted state`,
                ``,
                `## Next Steps`,
                `- [ ] Review and merge this PR (CI must pass)`,
                `- [ ] Investigate the root cause`,
                `- [ ] Create a fix PR`,
                `- [ ] Verify production is stable after merge`,
              ].join('\n'),
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['rollback', 'production', 'urgent'],
            });

            console.log(`Rollback PR created: ${pr.html_url}`);
