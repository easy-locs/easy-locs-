name: Execution Runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "execution_tasks row UUID"
        required: true
        type: string
      task_type:
        description: "Task type (e.g. SMOKE_NOOP)"
        required: true
        type: string
      supabase_url:
        description: "Supabase project URL for the callback"
        required: true
        type: string
      label:
        description: "Human-readable label embedded in the PR"
        required: false
        type: string
      # NOTE: callback_token is intentionally absent from inputs.
      # The runner computes HMAC-SHA256(RUNNER_HMAC_KEY, task_id) locally
      # using the GitHub repo secret. This keeps the credential out of
      # workflow_dispatch input metadata (visible in the GitHub UI).

jobs:
  run:
    name: "Execute task ${{ inputs.task_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      # ── Compute HMAC credential ───────────────────────────────────────
      # RUNNER_HMAC_KEY is a GitHub repo secret (never in workflow inputs/logs).
      # The same HMAC-SHA256(key, task_id) is pre-computed by execution-loop
      # and stored as runner_token_hash. Callback verifies constant-time.
      - name: Compute callback credential
        id: cred
        env:
          RUNNER_HMAC_KEY: ${{ secrets.RUNNER_HMAC_KEY }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          TOKEN=$(printf '%s' "$TASK_ID" | openssl dgst -sha256 -hmac "$RUNNER_HMAC_KEY" | awk '{print $2}')
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> "$GITHUB_OUTPUT"

      # ── Report RUNNING ────────────────────────────────────────────────
      - name: Callback — RUNNING
        env:
          RUNNER_TOKEN: ${{ steps.cred.outputs.value }}
          # Route all user-supplied inputs through env vars to avoid
          # Semgrep-flagged ${{ inputs.* }} interpolation in shell bodies.
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST \
            "$INPUT_SUPABASE_URL/functions/v1/execution-runner-callback" \
            -H "Content-Type: application/json" \
            -H "X-Runner-Token: $RUNNER_TOKEN" \
            -d "{
              \"task_id\": \"$INPUT_TASK_ID\",
              \"status\": \"RUNNING\",
              \"external_run_url\": \"$INPUT_RUN_URL\"
            }" || echo "RUNNING callback failed (non-fatal)"

      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Configure Git identity ────────────────────────────────────────
      - name: Configure Git
        run: |
          git config user.name  "execution-runner[bot]"
          git config user.email "execution-runner[bot]@users.noreply.github.com"

      # ── Create task-scoped branch ─────────────────────────────────────
      - name: Create branch exec/${{ inputs.task_id }}
        id: branch
        env:
          INPUT_TASK_ID: ${{ inputs.task_id }}
        run: |
          BRANCH="exec/$INPUT_TASK_ID"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      # ── Smoke / noop change ───────────────────────────────────────────
      # For SMOKE_NOOP: writes a timestamped marker file as proof of execution.
      # Real task types will replace this step with their actual work.
      - name: Apply noop change
        if: inputs.task_type == 'SMOKE_NOOP'
        env:
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_TASK_TYPE: ${{ inputs.task_type }}
          INPUT_RUN_ID: ${{ github.run_id }}
        run: |
          LABEL="$INPUT_LABEL"
          TASK_ID="$INPUT_TASK_ID"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p .execution-runs
          cat > ".execution-runs/${TASK_ID}.json" << EOF
          {
            "task_id": "$TASK_ID",
            "task_type": "$INPUT_TASK_TYPE",
            "label": "$LABEL",
            "executed_at": "$TS",
            "run_id": "$INPUT_RUN_ID",
            "runner": "github-actions"
          }
          EOF
          git add ".execution-runs/${TASK_ID}.json"
          git commit -m "feat(exec): smoke noop — task ${TASK_ID}

          execution-runner task ${TASK_ID} ($INPUT_TASK_TYPE)
          Label: $LABEL
          Run: $INPUT_RUN_ID
          Timestamp: $TS"

      # ── Run tests ─────────────────────────────────────────────────────
      - name: Validate artefact
        env:
          INPUT_TASK_ID: ${{ inputs.task_id }}
        run: |
          TASK_ID="$INPUT_TASK_ID"
          FILE=".execution-runs/${TASK_ID}.json"
          if [ -f "$FILE" ]; then
            python3 -c "import json,sys; json.load(open('$FILE')); print('JSON valid')"
          else
            echo "No artefact to validate (non-noop task type)"
          fi

      # ── Push branch ───────────────────────────────────────────────────
      - name: Push branch
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          git push origin "$BRANCH_NAME"

      # ── Open PR ───────────────────────────────────────────────────────
      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_LABEL: ${{ inputs.label }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_TASK_TYPE: ${{ inputs.task_type }}
          INPUT_BRANCH: ${{ steps.branch.outputs.branch }}
          INPUT_RUN_ID: ${{ github.run_id }}
          INPUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="$INPUT_LABEL"
          TASK_ID="$INPUT_TASK_ID"
          PR_URL="$(gh pr create \
            --base main \
            --head "$INPUT_BRANCH" \
            --title "feat(exec): ${LABEL:-smoke noop} — task ${TASK_ID:0:8}" \
            --body "## Execution Runner — Phase 1 Smoke

          | Field | Value |
          |-------|-------|
          | Task ID | \`${TASK_ID}\` |
          | Task type | \`${INPUT_TASK_TYPE}\` |
          | Label | ${LABEL:-(none)} |
          | Run | [${INPUT_RUN_ID}](${INPUT_RUN_URL}) |

          > Auto-generated by [execution-runner.yml](.github/workflows/execution-runner.yml). Do not merge automatically.
          ")"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "PR opened: $PR_URL"

      # ── Report SUCCESS ────────────────────────────────────────────────
      - name: Callback — SUCCESS
        if: success()
        env:
          RUNNER_TOKEN: ${{ steps.cred.outputs.value }}
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_PR_URL: ${{ steps.pr.outputs.pr_url }}
          INPUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST \
            "$INPUT_SUPABASE_URL/functions/v1/execution-runner-callback" \
            -H "Content-Type: application/json" \
            -H "X-Runner-Token: $RUNNER_TOKEN" \
            -d "{
              \"task_id\": \"$INPUT_TASK_ID\",
              \"status\": \"SUCCESS\",
              \"pr_url\": \"$INPUT_PR_URL\",
              \"external_run_url\": \"$INPUT_RUN_URL\"
            }"

      # ── Report FAILED ─────────────────────────────────────────────────
      - name: Callback — FAILED
        if: failure()
        env:
          RUNNER_TOKEN: ${{ steps.cred.outputs.value }}
          INPUT_SUPABASE_URL: ${{ inputs.supabase_url }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_RUN_ID: ${{ github.run_id }}
          INPUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -X POST \
            "$INPUT_SUPABASE_URL/functions/v1/execution-runner-callback" \
            -H "Content-Type: application/json" \
            -H "X-Runner-Token: $RUNNER_TOKEN" \
            -d "{
              \"task_id\": \"$INPUT_TASK_ID\",
              \"status\": \"FAILED\",
              \"error\": \"GitHub Actions job failed — check run $INPUT_RUN_ID for details\",
              \"external_run_url\": \"$INPUT_RUN_URL\"
            }" || echo "FAILED callback itself failed — operator must check manually"
