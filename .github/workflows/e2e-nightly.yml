name: E2E Tests (Nightly)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  WORKING_DIR: easy-locs-ea1eb0ed

jobs:
  e2e:
    name: Nightly Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      BASE_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Run E2E tests against production
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nightly
          path: ${{ env.WORKING_DIR }}/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results-nightly
          path: ${{ env.WORKING_DIR }}/test-results/
          retention-days: 7

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: e2e
    if: failure()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: Nightly E2E tests failed against production!\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n*Branch:* ${{ github.ref_name }}"
            }

      - name: Create GitHub issue for failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly E2E failure — ${new Date().toISOString().split('T')[0]}`;
            const body = [
              '## Nightly E2E Test Failure',
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Branch:** ${context.ref}`,
              `**Triggered at:** ${new Date().toISOString()}`,
              '',
              'Please investigate the failing tests. Playwright report and test results are attached as artifacts on the workflow run.',
            ].join('\n');
            const labels = [];
            for (const name of ['bug', 'e2e']) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name });
                labels.push(name);
              } catch {
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels,
            });
