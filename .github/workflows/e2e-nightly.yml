name: E2E Tests (Nightly)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  WORKING_DIR: easy-locs-ea1eb0ed

jobs:
  e2e:
    name: Nightly Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    env:
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      BASE_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Run E2E tests against production
        id: e2e
        continue-on-error: true
        run: npx playwright test

      - name: Collect trend data
        if: ${{ !cancelled() }}
        env:
          E2E_RUN_DATE: ${{ github.event.repository.updated_at || '' }}
          E2E_TRIGGER: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
        run: bash scripts/collect-e2e-trends.sh e2e-results.json e2e-trends/history.json

      - name: Generate step summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Nightly E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.e2e.outcome }}" == "success" ]; then
            echo "✅ **All e2e tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some e2e tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f e2e-trends/history.json ]; then
            LATEST=$(node -e "const h=JSON.parse(require('fs').readFileSync('e2e-trends/history.json','utf8'));const l=h[h.length-1];console.log('| Metric | Value |');console.log('|--------|-------|');console.log('| Total | '+l.total+' |');console.log('| Passed | '+l.passed+' |');console.log('| Failed | '+l.failed+' |');console.log('| Flaky | '+l.flaky+' |');console.log('| Pass Rate | '+l.passRate+'% |');console.log('| Duration | '+(l.durationMs/1000).toFixed(1)+'s |');")
            echo "$LATEST" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit trend data
        if: ${{ !cancelled() }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ env.WORKING_DIR }}/e2e-trends/history.json"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update e2e trend data [skip ci]"
          git push

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-nightly
          path: ${{ env.WORKING_DIR }}/playwright-report/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results-nightly
          path: ${{ env.WORKING_DIR }}/test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-trends
          path: ${{ env.WORKING_DIR }}/e2e-trends/
          retention-days: 30

  close-stale-issues:
    name: Close stale nightly failure issues
    runs-on: ubuntu-latest
    needs: e2e
    if: success()
    steps:
      - name: Close open nightly E2E failure issues
        id: close-issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'e2e',
              per_page: 100,
            });
            const nightlyIssues = issues.filter(
              (i) => !i.pull_request && i.title.startsWith('Nightly E2E failure')
            );
            core.info(`Closing ${nightlyIssues.length} stale nightly E2E issue(s)`);
            const closed = [];
            for (const issue of nightlyIssues) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Automatically closed: nightly E2E tests passed in [run #${context.runNumber}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}).`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              const safe = issue.title.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
              closed.push(`#${issue.number} — ${safe}`);
            }
            core.setOutput('closed_count', closed.length);
            core.setOutput('closed_summary', closed.join('\\n'));

      - name: Send Slack notification for auto-closed issues
        if: ${{ steps.close-issues.outputs.closed_count > 0 && secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: Nightly E2E tests passed — ${{ steps.close-issues.outputs.closed_count }} stale issue(s) auto-closed:\n${{ steps.close-issues.outputs.closed_summary }}\n*Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: e2e
    if: failure()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: Nightly E2E tests failed against production!\n*Workflow:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n*Branch:* ${{ github.ref_name }}"
            }

      - name: Create or update GitHub issue for failure
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            const today = now.split('T')[0];

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'e2e',
              per_page: 100,
            });
            const existing = openIssues.find(
              (i) => !i.pull_request && i.title.startsWith('Nightly E2E failure')
            );

            if (existing) {
              core.info(`Found existing issue #${existing.number} — adding comment`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: [
                  `## Still failing — ${today}`,
                  '',
                  `**Run:** ${runUrl}`,
                  `**Branch:** ${context.ref}`,
                  `**Triggered at:** ${now}`,
                  '',
                  'Playwright report and test results are attached as artifacts on the workflow run.',
                ].join('\n'),
              });
            } else {
              const title = `Nightly E2E failure — ${today}`;
              const body = [
                '## Nightly E2E Test Failure',
                '',
                `**Run:** ${runUrl}`,
                `**Branch:** ${context.ref}`,
                `**Triggered at:** ${now}`,
                '',
                'Please investigate the failing tests. Playwright report and test results are attached as artifacts on the workflow run.',
              ].join('\n');
              const labels = [];
              for (const name of ['bug', 'e2e']) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name });
                  labels.push(name);
                } catch {
                }
              }
              await github.rest.issues.create({ owner, repo, title, body, labels });
            }
