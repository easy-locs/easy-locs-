name: Bundle Size Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch for baseline comparison
        run: git fetch origin main:refs/remotes/origin/main --depth=1 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # NOTE: BUDGET_ENFORCE=false disables the absolute-KB performance-budget
        # plugin in vite.config.ts (which throws when CI=true). That plugin is a
        # *separate* concern from this workflow's job: here we only care about
        # *relative* growth vs the baseline (the +10% gate below). Letting the
        # in-vite plugin throw would fail the build before we ever reached the
        # gate, producing a red workflow even when bundle sizes are fine vs main.
        # If you ever want to re-enable the absolute budget here, drop this var
        # and trim the offending chunks first.
        #
        # SEO_GATE_BYPASS=1 is required for the same reason: the seo-validate
        # Vite plugin (vite-plugin-seo-validate.ts) throws in closeBundle when
        # any critical SEO issue is detected (current main has thousands of
        # "description exceeds 155 chars" findings on prerendered pages).
        # Vercel deploys succeed because that plugin auto-bypasses when
        # VERCEL=1 is set, but GitHub Actions has no such env, so without the
        # explicit bypass the build dies before dist/assets is ever produced
        # and the bundle-size-gate workflow fails for reasons unrelated to
        # bundle size. SEO regressions are policed by a separate concern; this
        # job only cares about relative bundle growth vs main.
        run: npm run build
        env:
          BUDGET_ENFORCE: 'false'
          SEO_GATE_BYPASS: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify build produced dist/assets
        # Defensive guard: if the build silently no-ops (e.g. a future plugin
        # short-circuits closeBundle or someone removes the bypass above), fail
        # loudly here with a clear message instead of letting bundle:gate exit
        # 1 with the cryptic "dist/assets not found" error.
        run: |
          if [ ! -d dist/assets ] || [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::Build did not produce dist/assets — bundle-size gate cannot run."
            echo "Check the 'Build project' step above for the underlying failure."
            exit 1
          fi
          echo "dist/assets contains $(ls dist/assets | wc -l) files."

      - name: Check bundle size against baseline
        run: npm run bundle:gate
        env:
          BUNDLE_SIZE_THRESHOLD: '0.10'
          BUNDLE_SIZE_BASELINE_REF: 'origin/main'

      - name: Append snapshot to bundle size history (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run bundle:history
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}

      - name: Check long-term bundle size trend (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: npm run bundle:trend
        env:
          BUNDLE_SIZE_TREND_THRESHOLD: '0.25'
          BUNDLE_SIZE_TREND_WINDOW_DAYS: '30'

      - name: Refresh baseline + history on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -e
          npm run bundle:gate -- update
          if git diff --quiet -- bundle-size-baseline.json bundle-size-history.json; then
            echo 'Baseline & history unchanged — nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bundle-size-baseline.json bundle-size-history.json
          git commit -m 'chore(ci): refresh bundle size baseline + history [skip ci]'
          # Rebase against any concurrent pushes, then push with retry.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Baseline + history refreshed (attempt ${attempt})."
                exit 0
              fi
            else
              echo "Rebase failed on attempt ${attempt}; aborting and retrying."
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "Could not refresh baseline/history after 3 attempts; gate result is preserved (this step is non-blocking)."
          exit 0

      - name: Upload baseline artifact (audit trail)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-baseline-${{ github.sha }}
          path: easy-locs-ea1eb0ed/bundle-size-baseline.json
          retention-days: 30

      - name: Upload bundle size history (audit trail)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-history-${{ github.sha }}
          path: easy-locs-ea1eb0ed/bundle-size-history.json
          retention-days: 90
