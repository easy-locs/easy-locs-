name: Bundle Size Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  bundle-size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch for baseline comparison
        run: git fetch origin main:refs/remotes/origin/main --depth=1 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Check bundle size against baseline
        run: npm run bundle:gate
        env:
          BUNDLE_SIZE_THRESHOLD: '0.10'
          BUNDLE_SIZE_BASELINE_REF: 'origin/main'

      - name: Refresh baseline on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run bundle:gate -- update
          if ! git diff --quiet -- bundle-size-baseline.json; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add bundle-size-baseline.json
            git commit -m 'chore(ci): refresh bundle size baseline [skip ci]'
            git push
          else
            echo 'Baseline unchanged.'
          fi
