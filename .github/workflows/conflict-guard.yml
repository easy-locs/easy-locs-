name: Conflict Guard

# Mandatory gate for every PR targeting main.
# Blocks merge if:
#   1. Unresolved git conflict markers exist (<<<<<<< / ======= / >>>>>>>)
#   2. The branch cannot be merged into main with zero conflicts
#
# Add "Conflict Guard" to the branch protection required-status-checks list
# so this check gates every merge.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conflict-guard:
    name: Conflict Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch main branch
        run: git fetch origin main

      - name: Scan for unresolved conflict markers
        run: |
          echo "Scanning all tracked files for unresolved merge-conflict markers…"
          # Use git ls-files so every tracked file is checked, regardless of extension.
          # Pipe through xargs git grep to avoid shell globbing limits.
          if git ls-files -z | xargs -0 git grep -lnE '^(<{7}|={7}|>{7})' 2>/dev/null; then
            echo ""
            echo "::error::Unresolved merge-conflict markers detected."
            echo "Resolve all <<<<<<< / ======= / >>>>>>> markers before merging."
            exit 1
          fi
          echo "✓ No conflict markers found."

      - name: Zero-conflict merge-tree check
        run: |
          echo "Running merge-tree dry-run against origin/main…"
          BASE=$(git merge-base HEAD origin/main)
          # git merge-tree outputs a unified diff of the theoretical merge.
          # Conflict blocks start with lines beginning with '<<<<<<<' or '>>>>>>>'.
          # The '=======' separator is also matched to catch partial conflict blocks.
          MERGE_OUT=$(git merge-tree "$BASE" HEAD origin/main 2>&1)
          if echo "$MERGE_OUT" | grep -qE '^(<{7}|={7}|>{7})'; then
            echo ""
            echo "::error::Merge conflicts detected when merging this branch into main."
            echo "Rebase or merge main into your branch and resolve all conflicts."
            echo ""
            echo "Conflict details:"
            echo "$MERGE_OUT" | grep -E '^(<{7}|={7}|>{7})' | head -20
            exit 1
          fi
          echo "✓ Zero merge conflicts — branch merges cleanly into main."
