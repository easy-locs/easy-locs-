name: "CI Mega-Gate 2026 — Zero Tolerance"

# ── Triggers ────────────────────────────────────────────────────────────────
# Runs on EVERY push to every branch and every pull request.
# Stale runs for the same branch/PR are cancelled immediately so that
# fresh commits always get a result as fast as possible.
on:
  push:
  pull_request:

# ── Concurrency ─────────────────────────────────────────────────────────────
# Cancel any in-progress run for the same branch / PR the moment a new
# commit arrives → ultra-reactive, no queuing stale pipelines.
concurrency:
  group: "ci-mega-gate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ── Minimal default permissions ──────────────────────────────────────────────
permissions:
  contents: read

# ── Shared env ───────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  WORKING_DIR: easy-locs-ea1eb0ed

# ════════════════════════════════════════════════════════════════════════════
# JOB: typecheck
# Full strict TypeScript compilation — zero type errors allowed.
# ════════════════════════════════════════════════════════════════════════════
jobs:
  typecheck:
    name: "🔷 TypeScript strict"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "TypeScript — noEmit strict check"
        run: npm run check:strict-core

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: lint
  # ESLint — zero warnings/errors allowed.
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 ESLint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "ESLint"
        run: npm run lint

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: unit-tests
  # Full Vitest suite including LC governance gates LC1..LC9.
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "🧪 Unit tests (Vitest + LC governance)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Vitest (full suite)"
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: contracts-tests
  # Edge-function contract tests (separate vitest config).
  # ══════════════════════════════════════════════════════════════════════════
  contracts-tests:
    name: "📋 Contract tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Contract tests"
        run: npm run test:contracts
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: e2e-smoke
  # Critical E2E smoke — only @smoke-tagged Playwright tests, chromium only.
  # ══════════════════════════════════════════════════════════════════════════
  e2e-smoke:
    name: "🎭 E2E critical smoke (Playwright)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Install Playwright (chromium only)"
        run: npx playwright install --with-deps chromium
      - name: "Critical E2E smoke (@smoke tag)"
        run: npx playwright test --project=chromium-desktop --grep "@smoke"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: structural
  # Route uniqueness, pillar-route ownership, @/ import aliases, orphan pages.
  # Any NEW violation fails the build — existing baselines are honoured.
  # ══════════════════════════════════════════════════════════════════════════
  structural:
    name: "🏗️ Structural checks"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "No NEW duplicate routes (baseline-enforced)"
        run: npm run check:route-uniqueness
      - name: "Pillar route ownership"
        run: npm run check:pillar-routes
      - name: "No NEW broken @/ imports (baseline-enforced)"
        run: npm run check:import-aliases
      - name: "No NEW orphan pages (baseline-enforced)"
        run: npm run check:page-orphans

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: edge-fn-contracts
  # Edge function contract matrix — stale docs = gate failure.
  # ══════════════════════════════════════════════════════════════════════════
  edge-fn-contracts:
    name: "🌐 Edge function contracts"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Edge function contract matrix"
        run: npm run contracts:matrix:ci

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: security-audit
  # npm audit (high+critical prod deps) + edge-functions auth inventory.
  # ══════════════════════════════════════════════════════════════════════════
  security-audit:
    name: "🔐 Security audit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "npm audit (prod deps, gate on high+)"
        run: npm audit --omit=dev --audit-level=high
      - name: "Edge functions auth inventory (drift check)"
        run: npx --yes tsx scripts/security-inventory-edge-functions.ts
      - name: "Check for inventory drift"
        run: |
          if ! git diff --exit-code -- docs/security/edge-functions-auth-inventory.md docs/security/unclassified-baseline.json; then
            echo "::error::Inventory is out of date — run 'npx tsx scripts/security-inventory-edge-functions.ts' and commit."
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: secret-scan
  # Scan all commits reachable from HEAD for leaked credentials.
  # ══════════════════════════════════════════════════════════════════════════
  secret-scan:
    name: "🔑 Secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Scan for leaked secrets"
        run: bash scripts/secret-scan.sh

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: sast
  # Semgrep SAST — OWASP Top 10 + JS/TS/React rule sets.
  # ══════════════════════════════════════════════════════════════════════════
  sast:
    name: "🛡️ SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: "Semgrep (OWASP + JS/TS/React)"
        run: |
          semgrep ci \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react
        env:
          SEMGREP_SEND_METRICS: "off"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: e2ee-tests
  # Orbit double-ratchet E2EE crypto tests.
  # ══════════════════════════════════════════════════════════════════════════
  e2ee-tests:
    name: "🔒 E2EE crypto tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: "Orbit E2EE double-ratchet tests"
        run: npx vitest run src/lib/__tests__/orbit-double-ratchet.test.ts

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: bundle-size
  # Ensures the bundle hasn't grown >10 % vs origin/main.
  # Non-blocking on pushes to main itself (the gate only compares against
  # a baseline ref; there's nothing to compare when *on* main).
  # ══════════════════════════════════════════════════════════════════════════
  bundle-size:
    name: "📦 Bundle size gate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Fetch main for baseline"
        run: git fetch origin main:refs/remotes/origin/main --depth=1 || true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: "Build"
        run: npm run build
        env:
          BUDGET_ENFORCE: "false"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: "Verify dist/assets produced"
        run: |
          if [ ! -d dist/assets ] || [ -z "$(ls -A dist/assets 2>/dev/null)" ]; then
            echo "::error::Build did not produce dist/assets."
            exit 1
          fi
          echo "dist/assets: $(ls dist/assets | wc -l) files"
      - name: "Bundle size gate (≤+10 % vs origin/main)"
        run: npm run bundle:gate
        env:
          BUNDLE_SIZE_THRESHOLD: "0.10"
          BUNDLE_SIZE_BASELINE_REF: "origin/main"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB: all-gates-passed  ← THE SINGLE REQUIRED STATUS CHECK
  # This job succeeds ONLY when every parallel gate above passes.
  # Register THIS job name in GitHub branch protection as the required
  # check. If any upstream job fails, this job is skipped/failed,
  # blocking the merge automatically.
  # ══════════════════════════════════════════════════════════════════════════
  all-gates-passed:
    name: "✅ ALL GATES PASSED — ready to merge"
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - lint
      - unit-tests
      - contracts-tests
      - e2e-smoke
      - structural
      - edge-fn-contracts
      - security-audit
      - secret-scan
      - sast
      - e2ee-tests
      - bundle-size
    # Always run this summary job so branch protection sees a definitive
    # result (pass or fail) rather than "skipped".
    if: always()
    steps:
      - name: "Evaluate all gate results"
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          LINT: ${{ needs.lint.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          CONTRACTS_TESTS: ${{ needs.contracts-tests.result }}
          E2E_SMOKE: ${{ needs.e2e-smoke.result }}
          STRUCTURAL: ${{ needs.structural.result }}
          EDGE_FN_CONTRACTS: ${{ needs.edge-fn-contracts.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          SAST: ${{ needs.sast.result }}
          E2EE_TESTS: ${{ needs.e2ee-tests.result }}
          BUNDLE_SIZE: ${{ needs.bundle-size.result }}
        run: |
          echo "═══════════════════════════════════════════"
          echo "  CI MEGA-GATE 2026 — GATE SUMMARY"
          echo "═══════════════════════════════════════════"
          FAILED=0
          check() {
            local name="$1" result="$2"
            if [ "$result" = "success" ]; then
              echo "  ✅  $name"
            else
              echo "  ❌  $name → $result"
              FAILED=1
            fi
          }
          check "TypeScript strict"         "$TYPECHECK"
          check "ESLint"                    "$LINT"
          check "Unit tests (Vitest)"       "$UNIT_TESTS"
          check "Contract tests"            "$CONTRACTS_TESTS"
          check "E2E critical smoke"        "$E2E_SMOKE"
          check "Structural checks"         "$STRUCTURAL"
          check "Edge fn contracts"         "$EDGE_FN_CONTRACTS"
          check "Security audit"            "$SECURITY_AUDIT"
          check "Secret scan"               "$SECRET_SCAN"
          check "SAST (Semgrep)"            "$SAST"
          check "E2EE crypto tests"         "$E2EE_TESTS"
          check "Bundle size gate"          "$BUNDLE_SIZE"
          echo "═══════════════════════════════════════════"
          if [ "$FAILED" -eq 1 ]; then
            echo "💥  ONE OR MORE GATES FAILED — MERGE BLOCKED"
            exit 1
          fi
          echo "🚀  ALL GATES GREEN — deployment ready"
