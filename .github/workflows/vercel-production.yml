name: Vercel Production Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.production-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify SHA matches CI run
        run: |
          echo "Deploying exact CI-validated commit: ${{ github.event.workflow_run.head_sha }}"
          echo "CI workflow run ID: ${{ github.event.workflow_run.id }}"
          echo "CI conclusion: ${{ github.event.workflow_run.conclusion }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production-url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Production URL: ${URL}"

      - name: Tag deployed commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          git tag -f "deploy/production-latest" "${DEPLOY_SHA}"
          git tag "deploy/production-${TIMESTAMP}" "${DEPLOY_SHA}"
          git push origin "deploy/production-latest" --force
          git push origin "deploy/production-${TIMESTAMP}"
          echo "Tagged ${DEPLOY_SHA} as deploy/production-latest and deploy/production-${TIMESTAMP}"

  skip-on-failure:
    name: Skip Deploy (CI Failed)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    steps:
      - name: CI failed — skipping production deployment
        run: |
          echo "::warning::CI Pipeline did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Production deployment skipped."
          exit 1
