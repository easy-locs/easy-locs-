name: Hardening Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening:
    name: typecheck • lint • unit • audit • structural
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easy-locs-ea1eb0ed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: easy-locs-ea1eb0ed/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 1. Static type safety
      - name: Typecheck
        run: npm run check:strict-core

      # 2. Lint
      - name: Lint
        run: npm run lint

      # 3. Unit + LC governance gates (vitest)
      - name: Unit tests
        run: npm test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # 4. Critical E2E smoke (subset of Playwright suite)
      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Critical E2E smoke
        run: npx playwright test --project=chromium-desktop --grep "@smoke"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        continue-on-error: true

      # 5. Dependency audit (high + critical only fail the build)
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

      # 6. Structural checks — duplicate routes / orphan pages /
      #    broken @/ imports (Task #1004 hardening contract).
      # Route uniqueness has known pre-existing duplicates tracked
      # separately; surfaced as a soft gate for visibility until cleanup
      # lands. Flip continue-on-error to false once the duplicate
      # backlog is empty.
      - name: No duplicate routes (advisory)
        run: npm run check:route-uniqueness
        continue-on-error: true

      - name: Pillar route ownership
        run: npm run check:pillar-routes

      - name: No NEW broken @/ imports (baseline-enforced)
        run: npm run check:import-aliases
