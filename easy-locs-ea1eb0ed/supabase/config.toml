[api]
# Expose domain schemas to PostgREST so that domainDb.schema.from() calls
# can target domain tables directly when desired. Public compat views ensure
# that existing .from("table") calls still work during the transition period.
schemas = [
  "public",
  "identity", "wallet", "orbit",
  "marketplace", "commerce", "property",
  "onboarding", "support", "notification",
  "system", "analytics"
]
extra_search_path = ["public", "extensions"]

# ─── Domain Routers ─────────────────────────────────────────────────────
# All routers handle JWT verification internally via shared middleware.
# Supabase-level JWT check is disabled to allow routers to handle auth
# exceptions (webhooks, public reads, pre-auth flows) per-route.

[functions.admin-router]
verify_jwt = false

[functions.ai-router]
verify_jwt = false

[functions.ai-proxy]
verify_jwt = false

[functions.booking-router]
verify_jwt = false

