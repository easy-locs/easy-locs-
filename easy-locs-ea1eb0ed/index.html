      <article style="max-width:800px;margin:0 auto;padding:32px 16px;font-family:system-ui,sans-serif;line-height:1.7;color:#1e293b;">
        <h1 style="font-size:28px;margin-bottom:16px;">Easy-Locs — Your All-in-One Super App</h1>
        <p style="font-size:16px;margin-bottom:24px;">Easy-Locs is the world's most comprehensive super app, connecting you to food delivery, taxi rides, hotel bookings, local services, property management, and more — all from a single platform. Available in over 190 countries, supporting 120+ currencies and 31 languages.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Order Food & Get Deliveries</h2>
        <p>Browse thousands of restaurants near you. Order your favorite meals with just a few taps. Track your delivery in real time from kitchen to doorstep. Whether you crave pizza, sushi, local specialties, or healthy options, Easy-Locs connects you with the best food providers in your area. Fast, reliable delivery with live tracking and secure payment.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Book Taxis & Rides</h2>
        <p>Need a ride? Easy-Locs connects you with nearby drivers instantly. Compare prices, choose your vehicle type, and track your driver in real time. From airport transfers to daily commutes, get safe, affordable rides anywhere in the world. Available 24/7 with transparent pricing and secure payments through your Easy-Locs wallet.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Find Hotels & Accommodation</h2>
        <p>Discover hotels, apartments, and vacation rentals worldwide. Compare rates, read reviews, and book instantly. From luxury resorts to budget-friendly stays, Easy-Locs helps you find the perfect accommodation for business trips, family vacations, or weekend getaways. Instant confirmation, flexible cancellation, and 24/7 support.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Discover Local Services</h2>
        <p>Find trusted local professionals for plumbing, electrical work, cleaning, beauty, healthcare, tutoring, and hundreds of other services. Browse profiles, check ratings, compare prices, and book appointments directly through the app. Every service provider is verified for your safety and satisfaction.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Manage Properties</h2>
        <p>Property owners and managers use Easy-Locs to list rentals, manage tenants, collect payments, handle maintenance requests, and track property performance. Whether you manage one apartment or hundreds of units, our professional tools streamline your entire property management workflow.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Send & Receive Money</h2>
        <p>The Easy-Locs Wallet lets you send money to friends, pay for services, receive payments, and manage your finances — all in one place. Support for 120+ currencies with competitive exchange rates. Scan QR codes for instant payments, split bills with friends, and track every transaction securely.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Communicate with Orbit</h2>
        <p>Orbit is your built-in communication hub. Chat with service providers, track orders, discuss bookings, and stay connected — all without leaving the app. Voice calls, media sharing, and real-time notifications keep you informed every step of the way.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Available Worldwide</h2>
        <p>Easy-Locs operates in over 190 countries across every continent. From Paris to Tokyo, Dubai to New York, Cape Town to Sydney — wherever you are, Easy-Locs connects you with the services you need. Fully localized in 31 languages with automatic currency conversion in 120+ currencies.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">For Providers & Businesses</h2>
        <p>Are you a restaurant, driver, hotel, or service provider? Join Easy-Locs to reach millions of customers worldwide. Our provider dashboard gives you powerful tools for managing orders, tracking revenue, handling customer conversations, and growing your business. Professional analytics, payout management, and marketing tools included.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Marketplace & Shopping</h2>
        <p>Browse a vast marketplace of products and services. From electronics and fashion to home goods and specialty items, Easy-Locs connects you with verified sellers and providers. Compare prices, read reviews, place orders, and track deliveries — all within one seamless experience. Support local businesses and discover unique offerings in every city.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Radar — Discover What's Around You</h2>
        <p>The Radar feature uses intelligent location-based technology to show you everything nearby. Restaurants, services, shops, hotels, and more — all mapped and scored by quality, distance, and relevance. Filter by category, sort by rating or proximity, and explore neighborhoods like never before. Real-time data ensures you always find what's open and available right now.</p>

        <h2 style="font-size:22px;margin-bottom:12px;">Safe, Secure & Free</h2>
        <p>Easy-Locs is completely free to download and use. Your personal data is protected with industry-leading encryption standards. All transactions go through secure payment processing. Every service provider is verified for your safety and satisfaction. With 24/7 customer support, help is always available when you need it. Start using Easy-Locs today — no subscription, no hidden fees, no commitments required. Join millions of users worldwide who trust Easy-Locs for their daily needs.</p>

    <script>
      window.__EASYLOCS_BOOTED__ = false;
      window.__EASYLOCS_REACT_MOUNTED__ = false;
      window.__EASYLOCS_BUNDLE_LOADED__ = false;

      (function () {
        var startedAt = Date.now();
        var timeoutMs = 15000;
        var retryKey = '__el_boot_retry_v1';

        function hasVisibleApp(root) {
          if (!root) return false;
          if (window.__EASYLOCS_BOOTED__ || window.__EASYLOCS_REACT_MOUNTED__) return true;
          var loading = root.querySelector('#app-loading');
          if (!loading && root.children.length > 0) return true;
          return false;
        }

        function showBootError() {
          var root = document.getElementById('root');
          if (!root || hasVisibleApp(root)) return;
          var alreadyRetried = sessionStorage.getItem(retryKey) === '1';
          if (!alreadyRetried) {
            try { sessionStorage.setItem(retryKey, '1'); } catch(e) {}
            try { caches.keys().then(function(n){return Promise.all(n.map(function(k){return caches.delete(k)}))}).then(function(){location.reload()}).catch(function(){location.reload()}) } catch(e) { location.reload(); }
            return;
          }
          sessionStorage.removeItem(retryKey);
          var target = root.querySelector('#app-loading') || root;
          target.innerHTML = '<div style="text-align:center;max-width:400px;padding:20px;"><p style="font-size:18px;color:#f8fafc;margin:0 0 8px;">Unable to load Easy-Locs</p><p style="font-size:13px;color:#94a3b8;margin:0 0 16px;">Please check your connection and try again.</p><button onclick="try{caches.keys().then(function(n){return Promise.all(n.map(function(k){return caches.delete(k)}))}).then(function(){location.reload()})}catch(e){location.reload()}" style="background:#D4A853;color:#0F1117;border:none;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">Reload</button></div>';
        }

        function checkBoot() {
          var root = document.getElementById('root');
          if (hasVisibleApp(root)) { sessionStorage.removeItem(retryKey); return; }
          if (Date.now() - startedAt < timeoutMs) {
            window.requestAnimationFrame(checkBoot);
            return;
          }
          showBootError();
        }

        window.requestAnimationFrame(checkBoot);
      })();
    </script>
