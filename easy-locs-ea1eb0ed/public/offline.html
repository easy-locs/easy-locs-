<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Easy-Locs</title>
  <style>
    :root { --bg: #fafafa; --fg: #1a1a2e; --muted: #64748b; --accent: #D4A853; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0F1117; --fg: #f8fafc; --muted: #94a3b8; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .container { text-align: center; max-width: 400px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    button {
      background: var(--accent); color: var(--bg); border: none;
      padding: 12px 28px; border-radius: 12px; font-size: 14px;
      font-weight: 600; cursor: pointer; min-height: 44px;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Easy-Locs needs an internet connection to load this page. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
